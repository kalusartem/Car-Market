name: Supabase keep-alive

# Free-tier Supabase projects are paused after a period of inactivity. This makes one
# tiny read-only request twice a week so the shared project stays awake.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets → Actions).

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query one listing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/listings?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept-Profile: carmarket"
